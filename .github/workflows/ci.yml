name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Lint (ruff check)
        run: ruff check evalgate/ tests/

      - name: Format check (ruff format)
        run: ruff format --check evalgate/ tests/

      - name: Smoke test (import, version, --help)
        run: |
          python -c "import evalgate; assert evalgate.__version__ == '0.1.0'"
          python -c "from evalgate.cli import app"
          evalgate --help

      - name: Run tests
        run: pytest tests/unit/ -v --tb=short

      # NOTE: Full eval runs (make eval, make noise, make gate) require Ollama
      # and are run locally or in nightly CI only. See ADR-002.
      # CI uses recorded fixtures for evaluation tests (added in M3+).
