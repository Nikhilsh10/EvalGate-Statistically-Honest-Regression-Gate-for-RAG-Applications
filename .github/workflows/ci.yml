name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check evalgate/ tests/

      - name: Format check (ruff format)
        run: ruff format --check evalgate/ tests/

      - name: Run tests
        run: pytest tests/unit/ -v --tb=short

      # NOTE: Full eval runs (make eval, make noise, make gate) require Ollama
      # and are run locally or in nightly CI only. See ADR-002.
      # CI uses recorded fixtures for evaluation tests (added in M3+).
