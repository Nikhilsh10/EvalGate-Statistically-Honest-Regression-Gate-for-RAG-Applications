[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalgate"
version = "0.1.0"
description = "Statistically honest regression gate for RAG applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nikhil Sharma" },
]
keywords = ["rag", "evaluation", "llm", "testing", "ci", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer==0.15.1",
    "rich==13.9.4",
    "httpx==0.28.1",
    "numpy==2.1.3",
    "scipy==1.14.1",
    "scikit-learn==1.6.0",
    "pandas==2.2.3",
    "mlflow==2.19.0",
    "ragas==0.2.14",
    "jinja2==3.1.4",
    "pydantic==2.10.3",
    "jsonlines==4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "pre-commit==4.0.1",
    "mypy==1.13.0",
]

[project.scripts]
evalgate = "evalgate.cli:app"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert used in tests
    "T201",  # print statements (CLI tool)
]

[tool.ruff.lint.isort]
known-first-party = ["evalgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring the target RAG app",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
